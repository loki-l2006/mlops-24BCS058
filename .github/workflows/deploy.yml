```yaml
name: Deploy Student Predictor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/mlops-24BCS058
            git pull origin main
            cd mlops-student
            sudo docker build -t student-app .
            sudo docker rm -f student-container || true
            sudo docker run -d --restart unless-stopped -p 8080:5000 --name student-container student-app
```
